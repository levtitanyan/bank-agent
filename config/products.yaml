# Banking products this agent monitors.
#
# `synonyms` feed fuzzy/semantic product resolution (Phase 3): the user may type
# "ipoteka", "consumer loan" or «սպառողական վարկ» and must land on the same product id.
# `seed_pages` / `seed_documents` are the fallback used when live discovery fails;
# results sourced from them are flagged is_seed so a reviewer knows they were not
# freshly discovered.
bank: ACBA Bank

# Terms that mean "not one of the products we monitor". A query containing one
# is penalized during resolution, because fuzzy matching alone would happily
# resolve "business mortgage" to our retail mortgage: the phrase contains it.
# ACBA really does sell all of these - we simply do not monitor them here.
unsupported_terms:
  - business
  - բիզնես
  - бизнес
  - agro
  - ագրո
  - card
  - քարտ
  - карт
  - deposit
  - ավանդ
  - вклад

products:
  # The monitored product is the unsecured consumer loan of up to 10M AMD.
  # ACBA sells several consumer loans, and the category page merely lists them:
  # it shows four headline percentages and never states an effective rate, so a
  # single set of ten tariff fields cannot be extracted from it honestly.
  - id: consumer_loan
    kind: loan
    name_hy: Սպառողական վարկ
    name_en: Consumer loan
    canonical_page: https://acba.am/hy/individual/loan/consumer-loan--up-to-10mln
    synonyms:
      hy:
        - սպառողական վարկ
        - սպառողական
        - անձնական վարկ
        - վարկ սպառողական նպատակներով
        - sparoxakan vark
      en:
        - consumer loan
        - personal loan
        - cash loan
        - consumer credit
      ru:
        - потребительский кредит
        - потребкредит
        - кредит наличными
        # Latin transliterations: people type these when the keyboard is English.
        - potrebitelskiy kredit
        - potrebkredit
    seed_pages:
      - https://acba.am/hy/individual/loans/consumer-loans
      - https://acba.am/hy/individual/loan/5G-loan
    seed_documents:
      - https://www.acba.am/files/loans-tariffs.pdf

  # The monitored product is the purchase mortgage. ACBA publishes a separate
  # information summary for the renovation mortgage, which is a different
  # product with different rates - excluded by name so discovery does not stop
  # for a human on every run over a document we already know is the wrong one.
  - id: mortgage
    kind: loan
    name_hy: Հիփոթեքային վարկ
    name_en: Mortgage
    canonical_page: https://acba.am/hy/individual/loan/purchase-mortgage
    exclude_terms:
      - վերանորոգման
      - վերանորոգում
      - renovation
      - ремонт
    synonyms:
      hy:
        - հիփոթեքային վարկ
        - հիփոթեք
        - բնակարանային վարկ
        - բնակարան ձեռք բերելու վարկ
        - hipotekayin vark
      en:
        - mortgage
        - mortgage loan
        - home loan
        - housing loan
        - property purchase loan
      ru:
        - ипотека
        - ипотечный кредит
        - жилищный кредит
        # Latin transliterations: people type these when the keyboard is English.
        - ipoteka
        - ipotechny kredit
    seed_pages:
      - https://acba.am/hy/individual/loan/purchase-mortgage
    seed_documents:
      - https://www.acba.am/files/loan%20info.pdf
      - https://www.acba.am/files/loans-tariffs.pdf
